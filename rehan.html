<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>selon</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #050505;
        overflow: hidden;
        font-family: Arial, sans-serif;
    }

    .text {
        position: relative;
        font-size: clamp(50px, 15vw, 150px);
        font-weight: 900;
        color: white;
        letter-spacing: 8px;
        animation: shake 0.15s infinite;
        text-shadow:
            5px 0 #ff0000,
            -5px 0 #00ffff;
    }

    .text::before,
    .text::after {
        content: "FUCK YOU";
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        overflow: hidden;
    }

    .text::before {
        color: #ff003c;
        animation: glitch1 0.8s infinite linear alternate-reverse;
    }

    .text::after {
        color: #00ffff;
        animation: glitch2 0.6s infinite linear alternate-reverse;
    }

    @keyframes shake {
        0%   { transform: translate(0); }
        25%  { transform: translate(3px, -2px); }
        50%  { transform: translate(-3px, 2px); }
        75%  { transform: translate(2px, 3px); }
        100% { transform: translate(0); }
    }

    @keyframes glitch1 {
        0% {
            clip-path: inset(10% 0 80% 0);
            transform: translate(-8px);
        }
        50% {
            clip-path: inset(50% 0 20% 0);
            transform: translate(8px);
        }
        100% {
            clip-path: inset(80% 0 5% 0);
            transform: translate(-5px);
        }
    }

    @keyframes glitch2 {
        0% {
            clip-path: inset(70% 0 5% 0);
            transform: translate(8px);
        }
        50% {
            clip-path: inset(15% 0 55% 0);
            transform: translate(-8px);
        }
        100% {
            clip-path: inset(5% 0 80% 0);
            transform: translate(5px);
        }
    }
</style>
</head>

<body>

<div class="text">FUCK YOU</div>

</body>
</html>
